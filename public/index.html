<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2f7d5b" />
  <title>Sistema Cunícola</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <nav class="bottomnav">
    <button data-view="tablero" class="active">📊<span>Tablero</span></button>
    <button data-view="animales">🐇<span>Animales</span></button>
    <button data-view="nuevo">➕<span>Nuevo</span></button>
  </nav>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="ghost">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
